name: Deploy para a VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Preparar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Enviar arquivos (rsync)
        run: |
          rsync -az --delete \
            --exclude='.well-known' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT || 22 }}" \
            dist/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}/"

      - name: Conferir captura de contatos
        run: |
          sleep 5
          r=$(curl -s "https://rendaonline.org/api/lead.php?status=1&t=$(date +%s)")
          echo "$r"
          echo "$r" | grep -q '"gravavel":true' || { echo "::warning::A captura de contatos (api/lead.php) não está gravando no servidor"; }

      - name: Avisar Bing e outros buscadores (IndexNow)
        continue-on-error: true
        run: |
          KEY=59ab20ffd8884543b609c188ca5a4f59
          urls=$(find dist -name 'sitemap-*.xml' ! -name 'sitemap-index.xml' -exec grep -oh '<loc>[^<]*</loc>' {} + | sed 's/<\/\?loc>//g' | head -10000)
          json=$(printf '%s\n' $urls | python3 -c "import json,sys; u=[l.strip() for l in sys.stdin if l.strip()]; print(json.dumps({'host':'rendaonline.org','key':'$KEY','keyLocation':'https://rendaonline.org/$KEY.txt','urlList':u}))")
          echo "Enviando $(printf '%s\n' $urls | wc -l) URLs"
          curl -s -o /dev/null -w "IndexNow: HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$json"
